[package]
name = "lab"
version = "0.1.0"
edition = "2024"
description = "Axum 학습 문서(study1~18)의 단계별 미니 예제 모음 (s01~s18, 단계마다 하나)"

# 각 예제는 `cargo run --example <이름>`으로 실행한다.
# demo/(study6~10 본 프로젝트), project/(최종 프로젝트)와 따로 두는 이유:
# 한 단계에서 배우는 것만 담은 50~200줄짜리 파일로 유지하기 위해서다.
[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
mongodb = "3.10.2"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SQLite 전용 (s06, s16). demo/가 PostgreSQL feature를 따로 갖는다.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "chrono", "macros", "migrate", "sqlite"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace", "request-id", "catch-panic", "timeout", "limit", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.3", features = ["v4"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
