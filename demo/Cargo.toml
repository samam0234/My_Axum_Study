[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
tower = { version = "0.5.3", features = ["util", "timeout"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "compression-gzip", "timeout", "limit", "request-id", "catch-panic", "normalize-path", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
uuid = { version = "1.26.1", features = ["v4"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }

# 릴리스 빌드 최적화.
# 빌드 시간은 늘어나지만 바이너리가 작아지고 실행이 빨라진다.
[profile.release]
opt-level = 3
lto = "thin"        # 크레이트 경계를 넘는 인라이닝. "fat"은 더 공격적이지만 훨씬 느리다
codegen-units = 1   # 병렬 컴파일을 포기하고 최적화 기회를 늘린다
strip = true        # 심볼 제거 (백트레이스는 잃는다)
# panic = "abort"   # ⚠️ 절대 켜지 말 것: CatchPanicLayer가 동작하지 않게 된다 (study7)
