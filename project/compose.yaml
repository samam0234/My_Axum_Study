# 웹사이트 + PostgreSQL. (studyFinal)
#   JWT_SECRET=$(python -c "import secrets;print(secrets.token_urlsafe(48))") docker compose up -d --build
#   → http://127.0.0.1:4000
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: board
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-board-dev-password}   # ⚠️ 로컬 기본값. 운영에서는 반드시 주입
      POSTGRES_DB: board
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d board"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: rust-board:latest
    depends_on:
      db:
        condition: service_healthy              # DB가 준비된 뒤에 앱을 띄운다
    ports:
      - "${WEB_PORT:-4000}:4000"
    environment:
      # 호스트 이름 `db`는 위 서비스 이름이다. (컨테이너 안의 localhost는 자기 자신)
      DATABASE_URL: postgres://board:${POSTGRES_PASSWORD:-board-dev-password}@db:5432/board
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 환경변수를 설정하세요}     # 없으면 시작 거부
      SECURE_COOKIE: ${SECURE_COOKIE:-false}                          # HTTPS 프록시 뒤에서는 true
      RUST_LOG: web=info,domain=info,tower_http=info
    restart: unless-stopped

volumes:
  pg-data:
